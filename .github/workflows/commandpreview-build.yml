name: Build CommandPreview

on:
  push:
    branches:
      - main
    paths:
      - "commandpreview/**"
      - ".github/workflows/commandpreview-build.yml"
  pull_request:
    paths:
      - "commandpreview/**"
      - ".github/workflows/commandpreview-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build mod JAR
        working-directory: commandpreview
        run: ./gradlew build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: commandpreview-mod
          path: commandpreview/build/libs/*.jar
          retention-days: 30
