[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arxgorithm-backend"
version = "0.1.0"
description = "Backend for arXiv paper recommendation site"
authors = [{name = "arXgorithm", email = "dev@arxgorithm.local"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.25.0",
    "aiosqlite>=0.19.0",
    "sqlite-vec>=0.1.0",
    "arxiv>=2.0.0",
    "authlib>=1.0",
    "PyJWT>=2.0",
    "itsdangerous>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
