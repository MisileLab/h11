services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: arxgorithm-backend
    ports:
      - "8000:8000"
    environment:
      # arXiv API
      - ARXIV_RATE_LIMIT=3.0
      
      # Database
      - DATABASE_URL=sqlite:////data/arxgorithm.db
      
      # Frontend URL for CORS
      - FRONTEND_URL=http://localhost:3000
      
      # Backend URL for OAuth callbacks
      - BACKEND_URL=http://localhost:8000
      
      # Session secret (required - must be explicitly provided)
      - SESSION_SECRET=${SESSION_SECRET}
      
      # API Keys (should be provided via .env file in production)
      - NEBIUS_API_KEY=${NEBIUS_API_KEY:-}
      - NEBIUS_API_URL=${NEBIUS_API_URL:-https://api.nebius.ai/v1}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
    
    volumes:
      - arxgorithm-data:/data
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    networks:
      - arxgorithm-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: arxgorithm-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - HOSTNAME=0.0.0.0
    
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    networks:
      - arxgorithm-network

volumes:
  arxgorithm-data:
    driver: local

networks:
  arxgorithm-network:
    driver: bridge
