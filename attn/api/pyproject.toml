[project]
name = "opencode-workbench-api"
version = "0.1.0"
description = "OpenCode Workbench API"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlmodel>=0.0.14",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "websockets>=12.0",
    "docker>=7.0.0",
    "httpx>=0.26.0",
    "aiofiles>=23.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
