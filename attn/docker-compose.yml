version: '3.8'

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: workbench-api
    ports:
      - "8001:8000"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - workbench-network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: workbench-web
    ports:
      - "3001:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - workbench-network

networks:
  workbench-network:
    driver: bridge
