[package]
name = "lapis"
version = "0.1.0"
edition = "2021"
description = "A block-level version control system for large binary files"
authors = ["Lapis Contributors"]

[lib]
name = "lapis"
crate-type = ["rlib"]

[[bin]]
name = "lapis"
path = "src/main.rs"

[features]
default = []
signing = ["dep:const-oid", "dep:regex", "dep:sha2", "dep:sigstore", "dep:sigstore_oidc", "dep:sigstore_protobuf_specs", "dep:x509-cert"]

[dependencies]
blake3 = { version = "1.5", features = ["rayon"] }
clap = { version = "4.4", features = ["derive"] }
thiserror = "1.0"
anyhow = "1.0"
fastcdc = "3.2"
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "sqlite", "migrate"] }
tokio = { version = "1.35", features = ["rt", "rt-multi-thread", "sync", "macros", "net"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zstd = "0.13"
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace"] }
reqwest = { version = "0.11", features = ["json"] }
qbsdiff = "0.1"
fuser = "0.14"
libc = "0.2"
regex = { version = "1.12", optional = true }
const-oid = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
sigstore = { version = "0.13.0", default-features = false, features = ["bundle", "sigstore-trust-root", "native-tls"], optional = true }
sigstore_oidc = { package = "sigstore-oidc", version = "0.6.4", default-features = false, features = ["browser", "native-tls"], optional = true }
sigstore_protobuf_specs = { version = "0.5", optional = true }
x509-cert = { version = "0.2", optional = true }

[profile.release]
opt-level = 3
lto = true

[dev-dependencies]
tempfile = "3.26.0"
proptest = "1.4"
rcgen = "0.13"
